<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="920" height="320" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="919" height="319" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- row labels -->
  <text x="24" y="67" fill="#57606a" font-size="12" font-weight="600" letter-spacing="0.5">SET UP ONCE</text>
  <text x="24" y="197" fill="#57606a" font-size="12" font-weight="600" letter-spacing="0.5">EVERY DRAFT</text>

  <g fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2">
    <!-- row 1 -->
    <rect x="130" y="40" width="140" height="44" rx="8"/>
    <rect x="320" y="40" width="150" height="44" rx="8"/>
    <rect x="520" y="40" width="130" height="44" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <!-- row 2 -->
    <rect x="130" y="170" width="90" height="44" rx="8"/>
    <rect x="260" y="170" width="90" height="44" rx="8"/>
    <rect x="390" y="170" width="120" height="44" rx="8"/>
    <rect x="680" y="170" width="90" height="44" rx="8"/>
    <rect x="800" y="170" width="100" height="44" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
    <rect x="535" y="252" width="100" height="40" rx="8"/>
  </g>
  <polygon points="585,158 633,192 585,226 537,192" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.2"/>

  <g fill="#1f2328" text-anchor="middle">
    <text x="200" y="67">Your writing</text>
    <text x="395" y="67">inspect + ingest</text>
    <text x="585" y="67" font-weight="600">calibrate</text>
    <text x="175" y="197">Task</text>
    <text x="305" y="197">Kit</text>
    <text x="450" y="189">Two drafts</text>
    <text x="450" y="206" font-size="11" fill="#57606a">opposed briefs</text>
    <text x="585" y="197" font-weight="600">Gate</text>
    <text x="725" y="197">Scrub</text>
    <text x="850" y="197" font-weight="600">Your draft</text>
    <text x="585" y="277">Rewrite</text>
  </g>

  <g fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)">
    <path d="M270,62 H318"/>
    <path d="M470,62 H518"/>
    <path d="M220,192 H258"/>
    <path d="M350,192 H388"/>
    <path d="M510,192 H535"/>
    <path d="M633,192 H678"/>
    <path d="M770,192 H798"/>
    <!-- calibrate feeds the kit and the gate -->
    <path d="M545,84 V126 H305 V168"/>
    <path d="M585,84 V156"/>
    <!-- fail: rewrite, back into the drafts -->
    <path d="M585,226 V250"/>
    <path d="M535,272 H450 V216"/>
  </g>
  <!-- your edits recalibrate -->
  <path d="M850,170 V62 H652" fill="none" stroke="#57606a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <g fill="#57606a" font-size="12">
    <text x="656" y="185">pass</text>
    <text x="593" y="243">fail</text>
    <text x="700" y="54">your edits recalibrate</text>
    <text x="320" y="120">rules + your closest passages</text>
  </g>
</svg>
